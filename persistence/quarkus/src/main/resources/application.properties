quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:bench}
quarkus.datasource.password=${DB_PASSWORD:bench}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bench}
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.transactions=enabled
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.second-level-caching-enabled=false
quarkus.hibernate-orm.jdbc.statement-batch-size=0
quarkus.hibernate-orm.log.sql=false
quarkus.index-dependency.model.group-id=dev.guicedee.benchmarks
quarkus.index-dependency.model.artifact-id=persistence-model
quarkus.analytics.disabled=true
