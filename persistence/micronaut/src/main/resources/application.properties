micronaut.application.name=persistence-benchmark
micronaut.server.host=0.0.0.0
micronaut.server.port=8080
datasources.default.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bench}
datasources.default.username=${DB_USER:bench}
datasources.default.password=${DB_PASSWORD:bench}
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.minimum-idle=0
datasources.default.maximum-pool-size=5
jpa.default.entity-scan.packages[0]=bench.persistence.model
jpa.default.properties.hibernate.hbm2ddl.auto=validate
jpa.default.properties.hibernate.cache.use_second_level_cache=false
jpa.default.properties.hibernate.cache.use_query_cache=false
jpa.default.properties.hibernate.jdbc.batch_size=0
jpa.default.properties.hibernate.show_sql=false
