quarkus.http.host=127.0.0.1
quarkus.http.port=${HTTP_PORT:18080}
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger
quarkus.smallrye-openapi.path=/openapi.json
quarkus.micrometer.export.prometheus.path=/metrics
quarkus.log.level=INFO
quarkus.analytics.disabled=true
quarkus.devservices.enabled=false
# The SDK's AsyncHttpClient keeps a Netty resolver in static state; create it at runtime.
quarkus.native.additional-build-args=--initialize-at-run-time=org.asynchttpclient
