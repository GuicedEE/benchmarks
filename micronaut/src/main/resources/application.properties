micronaut.application.name=benchmark
micronaut.server.host=${HTTP_HOST:127.0.0.1}
micronaut.server.port=${HTTP_PORT:18080}
micronaut.metrics.enabled=true
micronaut.metrics.export.prometheus.enabled=true
endpoints.prometheus.enabled=true
endpoints.prometheus.sensitive=false
endpoints.prometheus.path=/metrics
endpoints.metrics.enabled=false
micronaut.router.static-resources.openapi.mapping=/**
micronaut.router.static-resources.openapi.paths=classpath:META-INF/swagger
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger.paths[0]=classpath:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger.paths[1]=classpath:META-INF/swagger/views/swagger-ui/res
